name: Build and test

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - shell: pwsh
        run: .\build\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: smartbrowser-package
          path: build/output/pkg_smartbrowser-v*.zip
